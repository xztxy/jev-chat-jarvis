name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Gradle
        id: version
        run: |
          code=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          name=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "code=$code" >> $GITHUB_OUTPUT
          echo "name=$name" >> $GITHUB_OUTPUT
          echo "tag=v$name" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and build APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          grep -E "e: |error:|FAILED|Compilation error|FAILURE:" build-output.log -B 2 -A 8 > BUILD_ERROR.txt || true
          if [ ! -s BUILD_ERROR.txt ]; then
            tail -n 300 build-output.log > BUILD_ERROR.txt
          fi
          git add BUILD_ERROR.txt
          git commit -m "ci: capture build errors [skip ci]" || true
          git push origin HEAD:main || true

      - name: Publish APK to Release
        if: success()
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.name }}"
          asset="jev-assistant-${version}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          cat > release-notes.md <<EOF
          版本 $version（versionCode ${{ steps.version.outputs.code }}）

          提交：${{ github.sha }}

          自定义 OpenAI 兼容接口的地址、密钥与模型；模型列表可一键拉取选择；已恢复微信无障碍读取与手动截屏识别入口。
          EOF
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" --title "$tag" --notes-file release-notes.md "$asset"
          gh release edit "$tag" --latest
