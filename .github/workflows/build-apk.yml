name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Report Build Error Log
        if: failure()
        run: |
          echo "### Gradle Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f gradle-build.log ]; then
            tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No log generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jev-assistant-apks
          path: build-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
